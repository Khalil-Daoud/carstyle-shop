server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  client_max_body_size 25M;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

  location ^~ /api/ {
    proxy_pass http://carstyle-shop.railway.internal:3000/api/;
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    client_max_body_size 25M;
    proxy_request_buffering off;
  }

  location ^~ /img/ {
    proxy_pass http://carstyle-shop.railway.internal:3000/img/;
    proxy_pass http://backend:3000/img/;
    expires 7d;
    add_header Cache-Control "public";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}
